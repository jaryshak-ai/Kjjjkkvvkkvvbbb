              /** Экономика TpCoins через рефлексию: getEconomy() -> getBalance/getRoom/deposit. */
              static final class Eco {
                  final Object obj;
                  final Method mBalance;
                  final Method mRoom;
                  final Method mDeposit;

                  Eco(Plugin tp) throws Exception {
                      obj = tp.getClass().getMethod("getEconomy").invoke(tp);
                      Class<?> c = obj.getClass();
                      mBalance = c.getMethod("getBalance", String.class);
                      mRoom = c.getMethod("getRoom", String.class);
                      mDeposit = c.getMethod("deposit", String.class, Long.TYPE, String.class);
                  }

                  long balance(String key) throws Exception {
                      return ((Number) mBalance.invoke(obj, key)).longValue();
                  }

                  long room(String key) throws Exception {
                      return ((Number) mRoom.invoke(obj, key)).longValue();
                  }

                  String deposit(String key, long amount, String reason) throws Exception {
                      return String.valueOf(mDeposit.invoke(obj, key, amount, reason));
                  }
              }

              private volatile List<Category> categories = new ArrayList<>();
              private volatile List<Entry> allEntries = new ArrayList<>();
              private volatile Map<Integer, List<Entry>> byId = new HashMap<>();
              private final Map<String, Stock> stocks = new HashMap<>();
              private final Map<String, PStat> stats = new HashMap<>();
              private final Map<UUID, Snapshot> snapshots = new ConcurrentHashMap<>();
              private final Map<UUID, PendingForm> forms = new ConcurrentHashMap<>();
              private final Map<UUID, Session> sessions = new ConcurrentHashMap<>();
              private Eco eco;

              private double mn = 0.2;
              private double mx = 1.5;
              private double fast = 0.08;
              private double slow = 0.03;
              private double slowAbove = 1.2;
              private double s0 = 0.625;
              private long dailyLimit = 500000;
              private int snapMinutes = 10;
              private long period;
              private long spent;

              // ------------------------------------------------------------------ жизненный цикл

              @Override
              public void onEnable() {
                  saveResource("buyer.yml");
                  Plugin tp = getServer().getPluginManager().getPlugin("TpCoins");
                  if (tp == null) {
                      getLogger().error("TpCoins не найден - скупщик отключён.");
                      getServer().getPluginManager().disablePlugin(this);
                      return;
                  }
                  try {
                      eco = new Eco(tp);
                  } catch (Exception e) {
                      getLogger().error("Не удалось подключиться к экономике TpCoins: " + e, e);
                      getServer().getPluginManager().disablePlugin(this);
                      return;
                  }
                  loadState();
                  int[] r = loadConfig();
                  getServer().getPluginManager().registerEvents(this, this);
                  getLogger().info("Скупщик загружен: категорий " + r[0] + ", предметов " + r[1] + ".");
              }

              @Override
              public void onDisable() {
                  closeAll();
                  save();
              }

              private void closeAll() {
                  for (Session s : new ArrayList<>(sessions.values())) {
                      try {
                          if (s.inv != null && s.player.isOnline()) {
                              s.player.removeWindow(s.inv);
                          }
                      } catch (Exception ignored) {
                          // игрок мог уже выйти
                      }
                      returnItems(s);
                      cleanup(s);
                  }
                  forms.clear();
              }

              private long now() {
                  return System.currentTimeMillis();
              }

              // ------------------------------------------------------------------ конфиг

              private int[] loadConfig() {
                  List<Category> loaded = new ArrayList<>();
                  List<Entry> all = new ArrayList<>();
                  Map<Integer, List<Entry>> ids = new HashMap<>();
                  Map<String, Boolean> seen = new HashMap<>();
                  Config cfg = new Config(new File(getDataFolder(), "buyer.yml"), Config.YAML);
                  mn = cfg.getDouble("settings.min", 0.2);
                  mx = cfg.getDouble("settings.max", 1.5);
                  fast = cfg.getDouble("settings.decay_fast", 0.08);
                  slow = cfg.getDouble("settings.decay_slow", 0.03);
                  slowAbove = cfg.getDouble("settings.slow_above", 1.2);
                  dailyLimit = (long) cfg.getDouble("settings.daily_limit", 500000);
                  snapMinutes = (int) cfg.getDouble("settings.snapshot_minutes", 10);
                  s0 = mn < 1 ? (mx - mn) / (1 - mn) - 1 : 0;
                  if (!(s0 >= 0)) {
                      s0 = 0;
                  }
                  List<?> raw = cfg.getList("categories");
                  if (raw == null || raw.isEmpty()) {
                      getLogger().warning("buyer.yml: нет списка categories.");
                  } else {
                      for (Object co : raw) {
                          if (!(co instanceof Map)) {
                              continue;
                          }
                          Map<?, ?> cm = (Map<?, ?>) co;
                          Category c = new Category();
                          c.title = str(cm.get("title"), "Категория");
                          c.icon = str(cm.get("icon"), "");
                          Object io = cm.get("items");
                          if (io instanceof List) {
                              for (Object eo : (List<?>) io) {
                                  if (!(eo instanceof Map)) {
                                      continue;
                                  }
                                  Entry e = null;
                                  try {
                                      e = parseEntry((Map<?, ?>) eo);
                                  } catch (Exception ex) {
                                      getLogger().warning("buyer.yml: ошибка в записи " + eo + ": " + ex);
                                  }
                                  if (e == null || seen.containsKey(e.key)) {
                                      continue;
                                  }
                                  seen.put(e.key, Boolean.TRUE);
                                  c.items.add(e);
                                  all.add(e);
                                  ids.computeIfAbsent(e.itemId, x -> new ArrayList<>()).add(e);
                              }
                          }
                          if (!c.items.isEmpty()) {
                              loaded.add(c);
                          }
                      }
                  }
                  categories = loaded;
                  allEntries = all;
                  byId = ids;
                  long t = now();
                  for (Entry e : all) {
                      stock(e, t);
                  }
                  return new int[]{loaded.size(), all.size()};
              }

              private Entry parseEntry(Map<?, ?> em) {
                  Entry e = new Entry();
                  e.name = str(em.get("name"), "?");
                  e.price = dbl(em.get("price"), -1);
                  if (e.price <= 0) {
                      getLogger().warning("buyer.yml: у \"" + e.name + "\" нет цены - пропущен.");
                      return null;
                  }
                  if (em.get("book") != null) {
                      e.book = true;
                      e.enchId = (int) num(em.get("book"), -1);
                      e.maxLevel = (int) Math.max(1, num(em.get("max"), 1));
                      e.key = "book:" + e.enchId;
                      Item book = resolve("enchanted_book|book_enchanted", null);
                      Enchantment en = Enchantment.getEnchantment(e.enchId);
                      if (book == null || en == null) {
                          getLogger().warning("buyer.yml: книга зачарования " + e.enchId + " (" + e.name + ") не поддерживается - пропущена.");
                          return null;
                      }
                      book.addEnchantment(en.setLevel(e.maxLevel, false));
                      e.ref = book;
                      e.name = "Книга: " + e.name + (e.maxLevel > 1 ? " " + roman(e.maxLevel) : "");
                  } else {
                      String spec = str(em.get("id"), "");
                      Item it = spec.isEmpty() ? null : resolve(spec, e);
                      if (it == null) {
                          getLogger().warning("buyer.yml: предмет не найден: \"" + spec + "\" (" + e.name + ") - пропущен.");
                          return null;
                      }
                      e.ref = it;
                      e.key = spec.split("\\|")[0].trim().toLowerCase(Locale.ROOT);
                  }
                  e.itemId = e.ref.getId();
                  e.k = dbl(em.get("k"), -1);
                  if (e.k <= 0) {
                      e.k = e.price <= 10 ? 1000 : e.price <= 60 ? 300 : e.price <= 600 ? 60 : 10;
                  }
                  return e;
              }

              /** Предмет по названию; через | можно перечислить запасные названия. */
              private Item resolve(String spec, Entry e) {
                  for (String alt : spec.split("\\|")) {
                      String a = alt.trim();
                      if (a.isEmpty()) {
                          continue;
                      }
                      Item it = safeItem(a);
                      if (it != null) {
                          it.setCount(1);
                          if (e != null) {
                              int ci = a.indexOf(':');
                              if (ci > 0) {
                                  try {
                                      e.meta = Integer.parseInt(a.substring(ci + 1).trim());
                                  } catch (NumberFormatException ignored) {
                                      e.meta = -1;
                                  }
                              }
                          }
                          return it;
                      }
                  }
                  return null;
              }

              private static String roman(int n) {
                  String[] r = {"", "I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"};
                  return n >= 0 && n < r.length ? r[n] : String.valueOf(n);
              }

              private static String str(Object o, String def) {
                  return o == null ? def : String.valueOf(o);
              }

              private static long num(Object o, long def) {
                  return o instanceof Number ? ((Number) o).longValue() : def;
              }

              private static double dbl(Object o, double def) {
                  return o instanceof Number ? ((Number) o).doubleValue() : def;
              }

              // ------------------------------------------------------------------ состояние (сохранение)

              private void loadState() {
                  try {
                      File f = new File(getDataFolder(), "state.yml");
                      if (!f.exists()) {
                          return;
                      }
                      Config c = new Config(f, Config.YAML);
                      Map<String, Object> all = c.getAll();
                      period = num(all.get("period"), 0);
                      spent = num(all.get("spent"), 0);
                      Object so = all.get("stock");
                      if (so instanceof Map) {
                          for (Map.Entry<?, ?> en : ((Map<?, ?>) so).entrySet()) {
                              if (en.getValue() instanceof Map) {
                                  Map<?, ?> m = (Map<?, ?>) en.getValue();
                                  Stock st = new Stock();
                                  st.s = dbl(m.get("s"), 0);
                                  st.t = num(m.get("t"), now());
                                  stocks.put(String.valueOf(en.getKey()), st);
                              }
                          }
                      }
                      Object po = all.get("players");
                      if (po instanceof Map) {
                          for (Map.Entry<?, ?> en : ((Map<?, ?>) po).entrySet()) {
                              if (en.getValue() instanceof Map) {
                                  Map<?, ?> m = (Map<?, ?>) en.getValue();
                                  PStat ps = new PStat();
                                  ps.nick = str(m.get("nick"), String.valueOf(en.getKey()));
                                  ps.coins = num(m.get("coins"), 0);
                                  ps.items = num(m.get("items"), 0);
                                  stats.put(String.valueOf(en.getKey()), ps);
                              }
                          }
                      }
                  } catch (Exception ex) {
                      getLogger().error("Не удалось прочитать state.yml: " + ex, ex);
                  }
              }

              private void save() {
                  try {
                      getDataFolder().mkdirs();
                      LinkedHashMap<String, Object> all = new LinkedHashMap<>();
                      all.put("period", period);
                      all.put("spent", spent);
                      LinkedHashMap<String, Object> st = new LinkedHashMap<>();
                      for (Map.Entry<String, Stock> en : stocks.entrySet()) {
                          LinkedHashMap<String, Object> m = new LinkedHashMap<>();
                          m.put("s", en.getValue().s);
                          m.put("t", en.getValue().t);
                          st.put(en.getKey(), m);
                      }
                      all.put("stock", st);
                      LinkedHashMap<String, Object> pl = new LinkedHashMap<>();
                      for (Map.Entry<String, PStat> en : stats.entrySet()) {
                          LinkedHashMap<String, Object> m = new LinkedHashMap<>();
                          m.put("nick", en.getValue().nick);
                          m.put("coins", en.getValue().coins);
                          m.put("items", en.getValue().items);
                          pl.put(en.getKey(), m);
                      }
                      all.put("players", pl);
                      Config c = new Config(new File(getDataFolder(), "state.yml"), Config.YAML);
                      c.setAll(all);
                      c.save();
                  } catch (Exception ex) {
                      getLogger().error("Не удалось сохранить state.yml: " + ex, ex);
                  }
              }

              // ------------------------------------------------------------------ цены и лимит

              private double mult(Entry e, Stock st) {
                  return mn + (mx - mn) / (1.0 + st.s / e.k);
              }

              /** Запас предмета с учётом таяния за прошедшее время (8% в час, а выше порога цены - 3% в час). */
              private Stock stock(Entry e, long t) {
                  Stock st = stocks.get(e.key);
                  if (st == null) {
                      st = new Stock();
                      st.s = s0 * e.k;
                      st.t = t;
                      stocks.put(e.key, st);
                      return st;
                  }
                  double dt = (t - st.t) / 3600000.0;
                  if (dt <= 0) {
                      st.t = t;
                      return st;
                  }
                  double th = e.k * ((mx - mn) / (slowAbove - mn) - 1);
                  double s = st.s;
                  if (th > 0 && s > th) {
                      double t1 = Math.log(th / s) / Math.log(1 - fast);
                      if (dt <= t1) {
                          s = s * Math.pow(1 - fast, dt);
                      } else {
                          s = th * Math.pow(1 - slow, dt - t1);
                      }
                  } else {
                      s = s * Math.pow(1 - (th > 0 ? slow : fast), dt);
                  }
                  st.s = s;
                  st.t = t;
                  return st;
              }

              /** Цены игрока: фиксируются при первом просмотре и держатся, пока он не завершит продажу. */
              private Snapshot snapshotFor(Player p) {
                  long t = now();
                  Snapshot sn = snapshots.get(p.getUniqueId());
                  if (sn != null && t - sn.created < snapMinutes * 60000L) {
                      return sn;
                  }
                  sn = new Snapshot();
                  sn.created = t;
                  for (Entry e : allEntries) {
                      sn.price.put(e.key, e.price * mult(e, stock(e, t)));
                  }
                  snapshots.put(p.getUniqueId(), sn);
                  return sn;
              }

              /** Для сундука продажи: если цены вот-вот истекут (меньше 2 минут), берём свежие, чтобы окно не закрылось сразу. */
              private Snapshot snapshotForSell(Player p) {
                  Snapshot sn = snapshots.get(p.getUniqueId());
                  if (sn != null && sn.created + snapMinutes * 60000L - now() < MIN_LEFT_MS) {
                      snapshots.remove(p.getUniqueId());
                  }
                  return snapshotFor(p);
              }

              private long periodId(long t) {
                  return Math.floorDiv(t + MSK_MS + 60000L, DAY_MS);
              }

              private void checkPeriod() {
                  long id = periodId(now());
                  if (id != period) {
                      period = id;
                      spent = 0;
                  }
              }

              private long limitLeft() {
                  checkPeriod();
                  return Math.max(0, dailyLimit - spent);
              }

              /** Миллисекунд до сброса лимита (23:59 по Москве). */
              private long untilReset() {
                  long t = now();
                  long id = periodId(t);
                  return (id + 1) * DAY_MS - 60000L - (t + MSK_MS);
              }

              private static String fmtDur(long ms) {
                  long min = Math.max(0, ms) / 60000L;
                  long h = min / 60;
                  long m = min % 60;
                  return h > 0 ? h + " ч " + m + " мин" : m + " мин";
              }

              private static String fmtL(long v) {
                  return String.format(Locale.US, "%,d", v).replace(',', ' ');
              }

              private static String fmt(double v) {
                  if (v >= 100) {
                      return fmtL(Math.round(v));
                  }
                  String s = String.format(Locale.US, "%.1f", v);
                  return s.endsWith(".0") ? s.substring(0, s.length() - 2) : s;
              }

              /** Какая запись скупщика подходит к предмету (null - не покупает). */
              private Entry match(Item it) {
                  if (it == null || it.isNull()) {
                      return null;
                  }
                  List<Entry> l = byId.get(it.getId());
                  if (l == null) {
                      return null;
                  }
                  for (Entry e : l) {
                      if (e.book) {
                          Enchantment[] en = it.getEnchantments();
                          if (en != null && en.length == 1 && en[0].getId() == e.enchId) {
                              return e;
                          }
                      } else if (e.meta < 0 || e.meta == it.getDamage()) {
                          return e;
                      }
                  }
                  return null;
              }

              private double lvlFactor(Entry e, Item it) {
                  if (!e.book) {
                      return 1.0;
                  }
                  Enchantment[] en = it.getEnchantments();
                  if (en == null || en.length == 0) {
                      return 1.0;
                  }
                  int lvl = en[0].getLevel();
                  if (e.maxLevel <= 1 || lvl >= e.maxLevel) {
                      return 1.0;
                  }
                  return lvl <= 1 ? 0.3 : 0.6;
              }

              private double durFactor(Item it) {
                  int max = it.getMaxDurability();
                  if (max <= 0) {
                      return 1.0;
                  }
                  return Math.max(0.5, 1.0 - (double) it.getDamage() / max);
              }

              // ------------------------------------------------------------------ команды

              @Override
              public boolean onCommand(CommandSender sender, Command command, String label, String[] args) {
                  String n = command.getName();
                  if (n.equalsIgnoreCase("buyer")) {
                      if (!(sender instanceof Player)) {
                          sender.sendMessage("Эта команда только для игроков.");
                          return true;
                      }
                      showMainForm((Player) sender);
                      return true;
                  }
                  if (n.equalsIgnoreCase("buyerreload")) {
                      closeAll();
                      snapshots.clear();
                      int[] r = loadConfig();
                      sender.sendMessage("§aСкупщик перезагружен: категорий " + r[0] + ", предметов " + r[1] + ".");
                      return true;
                  }
                  return false;
              }

              // ------------------------------------------------------------------ формы

              private void showSimple(Player p, int type, String title, String content, String[] buttons, String[] icons) {
                  if (!p.isOnline()) {
                      return;
                  }
                  try {
                      FormWindowSimple f = new FormWindowSimple(title, content);
                      for (int i = 0; i < buttons.length; i++) {
                          String ic = icons == null ? null : icons[i];
                          if (ic != null && !ic.isEmpty()) {
                              f.addButton(new ElementButton(buttons[i],
                                      new ElementButtonImageData(ElementButtonImageData.IMAGE_DATA_TYPE_PATH, ic)));
                          } else {
                              f.addButton(new ElementButton(buttons[i]));
                          }
                      }
                      PendingForm pf = new PendingForm(type);
                      pf.id = p.showFormWindow(f);
                      forms.put(p.getUniqueId(), pf);
                  } catch (Exception e) {
                      err(p, "показ формы", e);
                      p.sendMessage("§cОшибка скупщика. Сообщи администратору.");
                  }
              }

              private String limitText() {
                  long left = limitLeft();
                  return "§8Лимит скупщика на сегодня: §1" + fmtL(left) + " §8из §0" + fmtL(dailyLimit) + " монет"
                          + "\n§8До сброса лимита: §0" + fmtDur(untilReset()) + " §8(сброс в 23:59 МСК)";
              }

              private void showMainForm(Player p) {
                  if (!p.isOnline()) {
                      return;
                  }
                  Session old = sessions.get(p.getUniqueId());
                  if (old != null) {
                      closeChest(old);
                  }
                  String text = "§0Баланс: §1" + fmtL(safeBalance(p)) + " монет\n" + limitText() + "\n\n§8Выбери действие:";
                  showSimple(p, F_MAIN, "§l§0Скупщик", text,
                          new String[]{
                                  "§l§0Продать предметы§r\n§0Открыть сундук продажи",
                                  "§l§0Посмотреть цены на продажу§r\n§0Актуальные цены",
                                  "§l§0Статистика§r\n§0Сколько ты продал",
                                  "§l§0Топ продавцев§r\n§0Топ 10 по сумме",
                                  "§l§0Как работает скупщик?§r\n§0Подробное объяснение"},
                          new String[]{
                                  "textures/items/gold_ingot",
                                  "textures/items/paper",
                                  "textures/items/book_writable",
                                  "textures/items/emerald",
                                  "textures/items/book_normal"});
              }

              private void showPricesMenu(Player p) {
                  List<Category> cats = categories;
                  if (cats.isEmpty()) {
                      p.sendMessage("§cСкупщик пока ничего не покупает.");
                      return;
                  }
                  snapshotFor(p);
                  String[] b = new String[cats.size() + 1];
                  String[] ic = new String[cats.size() + 1];
                  for (int i = 0; i < cats.size(); i++) {
                      Category c = cats.get(i);
                      b[i] = "§l§0" + c.title + "§r\n§0Позиций: §l§0" + c.items.size();
                      ic[i] = c.icon;
                  }
                  b[cats.size()] = "§l§0Назад";
                  ic[cats.size()] = "";
                  showSimple(p, F_PRICES, "§l§0Цены на продажу",
                          "§8Цены зафиксированы для тебя и не меняются, пока ты не завершишь продажу (но не дольше " + snapMinutes
                                  + " мин.).\n§8Чем больше скупщику продают, тем он платит меньше, и наоборот.\n\n§8Выбери категорию:",
                          b, ic);
              }

              private void showPriceCat(Player p, int ci) {
                  List<Category> cats = categories;
                  if (ci < 0 || ci >= cats.size()) {
                      showPricesMenu(p);
                      return;
                  }
                  Category c = cats.get(ci);
                  Snapshot sn = snapshotFor(p);
                  StringBuilder sb = new StringBuilder();
                  sb.append("§8Цена за 1 шт. В скобках отличие от обычной цены.");
                  if (c.items.get(0).book) {
                      sb.append("\n§8Цена указана за максимальный уровень. Уровень I = x0.3, средние = x0.6.");
                  }
                  sb.append("\n");
                  for (Entry e : c.items) {
                      Double pr = sn.price.get(e.key);
                      double price = pr == null ? e.price : pr;
                      int pct = (int) Math.round(price / e.price * 100) - 100;
                      String col = pct > 0 ? "§1+" : pct < 0 ? "§4" : "§8±";
                      sb.append("\n§0").append(e.name).append("\n  §1").append(fmt(price)).append(" монет §8(").append(col)
                              .append(pct).append("%§8)");
                  }
                  showSimple(p, F_PRICECAT, "§l§0" + c.title, sb.toString(), new String[]{"§l§0Назад"}, null);
              }

              private List<PStat> sortedStats() {
                  List<PStat> l = new ArrayList<>(stats.values());
                  l.sort((a, b) -> Long.compare(b.coins, a.coins));
                  return l;
              }

              private void showStats(Player p) {
                  PStat ps = stats.get(key(p));
                  String text;
                  if (ps == null || ps.coins <= 0) {
                      text = "§8Ты пока ничего не продавал скупщику.";
                  } else {
                      int rank = sortedStats().indexOf(ps) + 1;
                      text = "§0Ты продал скупщику:\n§8Предметов: §1" + fmtL(ps.items) + " шт.\n§8На сумму: §1" + fmtL(ps.coins)
                              + " монет\n§8Место в топе продавцев: §0#" + rank;
                  }
                  text += "\n\n§8Сегодня скупщик уже купил на §0" + fmtL(dailyLimit - limitLeft()) + " §8монет.\n" + limitText();
                  showSimple(p, F_BACK, "§l§0Статистика", text, new String[]{"§l§0Назад"}, null);
              }

              private void showTop(Player p) {
                  List<PStat> l = sortedStats();
                  StringBuilder sb = new StringBuilder("§8Топ 10 по сумме монет, проданных скупщику:\n");
                  if (l.isEmpty()) {
                      sb.append("\n§8Пока никто ничего не продал.");
                  }
                  for (int i = 0; i < Math.min(10, l.size()); i++) {
                      PStat s = l.get(i);
                      String col = i == 0 ? "§5" : i == 1 ? "§1" : i == 2 ? "§4" : "§8";
                      sb.append("\n").append(col).append("#").append(i + 1).append(" §0").append(s.nick).append(" §8- §1")
                              .append(fmtL(s.coins)).append(" монет");
                  }
                  PStat me = stats.get(key(p));
                  if (me != null && me.coins > 0) {
                      sb.append("\n\n§8Твоё место: §0#").append(l.indexOf(me) + 1).append(" §8(").append(fmtL(me.coins)).append(" монет)");
                  }
                  showSimple(p, F_BACK, "§l§0Топ продавцев", sb.toString(), new String[]{"§l§0Назад"}, null);
              }

