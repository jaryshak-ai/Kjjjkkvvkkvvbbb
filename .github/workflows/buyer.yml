name: Build Buyer

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate project files
        run: |
          set -e
          mkdir -p src/main/java/buyer src/main/resources
          cat > pom.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 http://maven.apache.org/xsd/maven-4.0.0.xsd">
              <modelVersion>4.0.0</modelVersion>

              <groupId>buyer</groupId>
              <artifactId>Buyer</artifactId>
              <version>1.0.0</version>
              <packaging>jar</packaging>

              <properties>
                  <maven.compiler.source>17</maven.compiler.source>
                  <maven.compiler.target>17</maven.compiler.target>
                  <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
              </properties>

              <repositories>
                  <repository>
                      <id>lanink</id>
                      <url>https://repo.lanink.cn/repository/maven-public/</url>
                  </repository>
              </repositories>

              <dependencies>
                  <dependency>
                      <groupId>cn.nukkit</groupId>
                      <artifactId>Nukkit</artifactId>
                      <version>MOT-SNAPSHOT</version>
                      <scope>provided</scope>
                  </dependency>
              </dependencies>

              <build>
                  <finalName>Buyer-${project.version}</finalName>
                  <plugins>
                      <plugin>
                          <groupId>org.apache.maven.plugins</groupId>
                          <artifactId>maven-compiler-plugin</artifactId>
                          <version>3.11.0</version>
                          <configuration>
                              <release>17</release>
                              <encoding>UTF-8</encoding>
                          </configuration>
                      </plugin>
                  </plugins>
              </build>
          </project>
          EOF
          cat > src/main/resources/plugin.yml << 'EOF'
          name: Buyer
          main: buyer.Buyer
          version: "1.0.0"
          api: ["1.0.0"]
          author: jaryshak
          description: Скупщик /buyer - графическое меню, сундук продажи, прогрессивные цены, дневной лимит, статистика и топ продавцев (оплата монетами TpCoins)
          depend: [TpCoins]

          commands:
            buyer:
              description: Открыть скупщика
              usage: /buyer
              aliases: [skup]
              permission: buyer.use
            buyerreload:
              description: Перезагрузить buyer.yml
              usage: /buyerreload
              permission: buyer.reload

          permissions:
            buyer.use:
              description: Пользоваться скупщиком
              default: "true"
            buyer.reload:
              description: Перезагружать buyer.yml
              default: op
          EOF
          cat > src/main/resources/buyer.yml << 'EOF'
          # Скупщик /buyer. price = базовая («обычная») цена за 1 шт. продажи игроком.
          # Итоговая цена = price x множитель. Множитель считается по формуле:
          #   множитель = min + (max - min) / (1 + S / k)
          # S - сколько штук этого предмета скупили (растёт при продаже, сам тает со временем).
          # k - «ёмкость рынка»: сколько штук нужно продать, чтобы цена заметно просела.
          #   Если k не указан - берётся по цене: до 10 -> 1000, до 60 -> 300, до 600 -> 60, дороже -> 10.
          # id - название предмета Nukkit (можно id:meta, напр. dye:4). Через | можно указать запасные названия.
          #   Если у id нет :meta - подходит любой мета (любая древесина, любой цвет шерсти, любой износ инструмента).
          # book - ID зачарования (книга с ОДНИМ этим зачарованием), max - максимальный уровень.
          #   Книга ниже максимума стоит дешевле: уровень 1 = x0.3, средние уровни = x0.6.
          # Повреждённые инструменты и броня стоят пропорционально прочности (но не меньше 50% цены).
          settings:
            min: 0.2            # минимум цены = -80% от обычной
            max: 1.5            # максимум цены = +50% от обычной
            decay_fast: 0.08    # S тает на 8% в час
            decay_slow: 0.03    # если цена выше slow_above, S тает на 3% в час
            slow_above: 1.2     # порог (1.2 = 120% от обычной цены)
            daily_limit: 500000 # лимит монет в день на ВЕСЬ сервер, сброс в 23:59 по Москве
            snapshot_minutes: 10 # максимум минут, сколько цены игрока фиксируются; потом окно скупщика закрывается само

