          package buyer;

          import cn.nukkit.Player;
          import cn.nukkit.block.Block;
          import cn.nukkit.command.Command;
          import cn.nukkit.command.CommandSender;
          import cn.nukkit.event.EventHandler;
          import cn.nukkit.event.EventPriority;
          import cn.nukkit.event.Listener;
          import cn.nukkit.event.inventory.InventoryCloseEvent;
          import cn.nukkit.event.inventory.InventoryTransactionEvent;
          import cn.nukkit.event.player.PlayerFormRespondedEvent;
          import cn.nukkit.event.player.PlayerQuitEvent;
          import cn.nukkit.form.element.ElementButton;
          import cn.nukkit.form.element.ElementButtonImageData;
          import cn.nukkit.form.response.FormResponseSimple;
          import cn.nukkit.form.window.FormWindowSimple;
          import cn.nukkit.inventory.ContainerInventory;
          import cn.nukkit.inventory.Inventory;
          import cn.nukkit.inventory.InventoryHolder;
          import cn.nukkit.inventory.InventoryType;
          import cn.nukkit.inventory.transaction.action.InventoryAction;
          import cn.nukkit.inventory.transaction.action.SlotChangeAction;
          import cn.nukkit.item.Item;
          import cn.nukkit.item.enchantment.Enchantment;
          import cn.nukkit.level.Level;
          import cn.nukkit.math.Vector3;
          import cn.nukkit.nbt.NBTIO;
          import cn.nukkit.nbt.tag.CompoundTag;
          import cn.nukkit.network.protocol.BlockEntityDataPacket;
          import cn.nukkit.plugin.Plugin;
          import cn.nukkit.plugin.PluginBase;
          import cn.nukkit.scheduler.Task;
          import cn.nukkit.utils.Config;

          import java.io.File;
          import java.lang.reflect.Method;
          import java.nio.ByteOrder;
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.LinkedHashMap;
          import java.util.List;
          import java.util.Locale;
          import java.util.Map;
          import java.util.UUID;
          import java.util.concurrent.ConcurrentHashMap;

          /**
           * Скупщик /buyer: графическое меню -> сундук продажи / цены / статистика / топ / справка.
           * Цены прогрессивные: чем больше продают, тем ниже цена (от -80% до +50% к обычной), со временем цена восстанавливается.
           * Общий дневной лимит скупщика (на весь сервер), сброс в 23:59 по Москве. Оплата монетами TpCoins.
           */
          public class Buyer extends PluginBase implements Listener {

              private static final int ITEM_SLOTS = 18;
              private static final int S_INFO = 20;
              private static final int S_SELL = 22;
              private static final int S_CANCEL = 24;
              private static final int F_MAIN = 0;
              private static final int F_PRICES = 1;
              private static final int F_PRICECAT = 2;
              private static final int F_BACK = 3;
              private static final long DAY_MS = 86400000L;
              private static final long MSK_MS = 3L * 3600000L;
              private static final String TITLE = "§lСкупщик";
              private static final String EXPIRED = "§cВы слишком долго были в меню, войдите снова.";
              private static final long MIN_LEFT_MS = 120000L;

              static final class Entry {
                  String key;
                  String name;
                  double price;
                  double k;
                  Item ref;
                  int itemId;
                  int meta = -1;
                  boolean book;
                  int enchId = -1;
                  int maxLevel = 1;
              }

              static final class Category {
                  String title;
                  String icon;
                  List<Entry> items = new ArrayList<>();
              }

              static final class Stock {
                  double s;
                  long t;
              }

              static final class PStat {
                  String nick;
                  long coins;
                  long items;
              }

