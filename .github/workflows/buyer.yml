              @EventHandler
              public void onForm(PlayerFormRespondedEvent e) {
                  final Player p = e.getPlayer();
                  PendingForm pf = forms.get(p.getUniqueId());
                  if (pf == null || pf.id != e.getFormID()) {
                      return;
                  }
                  forms.remove(p.getUniqueId());
                  try {
                      if (e.wasClosed() || e.getResponse() == null) {
                          return;
                      }
                      int b = ((FormResponseSimple) e.getResponse()).getClickedButtonId();
                      if ((pf.type == F_PRICES || pf.type == F_PRICECAT) && now() - pf.created >= snapMinutes * 60000L) {
                          p.sendMessage(EXPIRED);
                          return;
                      }
                      if (pf.type == F_MAIN) {
                          if (b == 0) {
                              openSell(p);
                          } else if (b == 1) {
                              showPricesMenu(p);
                          } else if (b == 2) {
                              showStats(p);
                          } else if (b == 3) {
                              showTop(p);
                          } else if (b == 4) {
                              showHelp(p);
                          }
                      } else if (pf.type == F_PRICES) {
                          if (b < categories.size()) {
                              showPriceCat(p, b);
                          } else {
                              showMainForm(p);
                          }
                      } else if (pf.type == F_PRICECAT) {
                          showPricesMenu(p);
                      } else {
                          showMainForm(p);
                      }
                  } catch (Exception ex) {
                      err(p, "обработка формы (onForm)", ex);
                      p.sendMessage("§cОшибка скупщика. Сообщи администратору.");
                  }
              }

              // ------------------------------------------------------------------ сундук продажи

              private void openSell(Player p) {
                  if (!p.isOnline()) {
                      return;
                  }
                  if (allEntries.isEmpty()) {
                      p.sendMessage("§cСкупщик пока ничего не покупает.");
                      return;
                  }
                  if (limitLeft() <= 0) {
                      p.sendMessage("§cСкупщик сегодня больше ничего не покупает: дневной лимит исчерпан. Сброс через "
                              + fmtDur(untilReset()) + " (23:59 МСК).");
                      later(2, () -> showMainForm(p));
                      return;
                  }
                  UUID id = p.getUniqueId();
                  Session old = sessions.get(id);
                  if (old != null) {
                      boolean alive = old.open && old.inv != null && p.getWindowId(old.inv) >= 0;
                      boolean pending = !old.open && System.currentTimeMillis() - old.created < 2000;
                      if (alive || pending) {
                          return;
                      }
                      closeChest(old);
                  }
                  Level lv = p.getLevel();
                  int x = p.getFloorX();
                  int z = p.getFloorZ();
                  int y = p.getFloorY() + 3;
                  if (y > 250) {
                      y = Math.max(1, p.getFloorY() - 3);
                  }
                  Session s = new Session(p, lv, x, y, z);
                  s.snap = snapshotForSell(p);
                  sessions.put(id, s);
                  try {
                      sendFake(p, lv, x, y, z);
                  } catch (Exception e) {
                      err(p, "подготовка сундука (sendFake)", e);
                      sessions.remove(id, s);
                      p.sendMessage("§cОшибка скупщика. Сообщи администратору.");
                      return;
                  }
                  // даём клиенту время принять блок сундука, и только потом открываем окно
                  later(10, () -> finishOpen(s));
                  // цены держатся не дольше snapMinutes: потом окно закрывается само
                  long leftMs = s.snap.created + snapMinutes * 60000L - now();
                  later((int) Math.max(20, leftMs / 50), () -> {
                      if (sessions.get(id) == s) {
                          closeChest(s);
                          if (p.isOnline()) {
                              p.sendMessage(EXPIRED);
                          }
                      }
                  });
              }

              private void finishOpen(Session s) {
                  Player p = s.player;
                  if (sessions.get(p.getUniqueId()) != s) {
                      return;
                  }
                  if (!p.isOnline() || p.getLevel() != s.level) {
                      cleanup(s);
                      return;
                  }
                  try {
                      Menu m = new Menu(new Holder(s.x, s.y, s.z));
                      s.inv = m;
                      renderControls(s);
                      int wid = p.addWindow(m);
                      if (wid < 0) {
                          cleanup(s);
                          p.sendMessage("§cНе удалось открыть сундук продажи, попробуй ещё раз.");
                          return;
                      }
                      s.open = true;
                  } catch (Exception e) {
                      err(p, "открытие окна (finishOpen)", e);
                      cleanup(s);
                      p.sendMessage("§cОшибка скупщика. Сообщи администратору.");
                  }
              }

              private void sendFake(Player p, Level lv, int x, int y, int z) throws Exception {
                  Block b = Block.get(Block.CHEST, 2);
                  b.x = x;
                  b.y = y;
                  b.z = z;
                  b.level = lv;
                  lv.sendBlocks(new Player[]{p}, new Vector3[]{b});

                  CompoundTag tag = new CompoundTag()
                          .putString("id", "Chest")
                          .putInt("x", x)
                          .putInt("y", y)
                          .putInt("z", z)
                          .putString("CustomName", TITLE);
                  BlockEntityDataPacket pk = new BlockEntityDataPacket();
                  pk.x = x;
                  pk.y = y;
                  pk.z = z;
                  pk.namedTag = NBTIO.write(tag, ByteOrder.LITTLE_ENDIAN, true);
                  p.dataPacket(pk);
              }

              private void restoreBlock(Session s) {
                  try {
                      if (s.player.isOnline() && s.player.getLevel() == s.level) {
                          s.level.sendBlocks(new Player[]{s.player}, new Vector3[]{new Vector3(s.x, s.y, s.z)});
                      }
                  } catch (Exception ignored) {
                      // игрок мог выйти
                  }
              }

              /** Идемпотентная уборка сессии: убирает запись и возвращает настоящий блок. */
              private void cleanup(Session s) {
                  if (!sessions.remove(s.player.getUniqueId(), s)) {
                      return;
                  }
                  s.open = false;
                  restoreBlock(s);
              }

              /** Закрыть сундук у игрока (предметы вернутся в инвентарь) и убрать сессию. */
              private void closeChest(Session s) {
                  try {
                      if (s.inv != null && s.player.isOnline()) {
                          s.player.removeWindow(s.inv);
                      }
                  } catch (Exception ignored) {
                      // игрок мог выйти
                  }
                  returnItems(s);
                  cleanup(s);
              }

              /** Вернуть игроку всё, что осталось в сундуке продажи. */
              private void returnItems(Session s) {
                  if (s.inv == null) {
                      return;
                  }
                  for (int i = 0; i < ITEM_SLOTS; i++) {
                      Item it = s.inv.getItem(i);
                      if (it != null && !it.isNull()) {
                          s.inv.clear(i);
                          if (s.player.isOnline()) {
                              give(s.player, it, it.getCount());
                          }
                      }
                  }
              }

              private void later(int ticks, Runnable r) {
                  getServer().getScheduler().scheduleDelayedTask(new Task() {
                      @Override
                      public void onRun(int currentTick) {
                          r.run();
                      }
                  }, ticks);
              }

              private void err(Player p, String where, Throwable e) {
                  getLogger().error("[ОШИБКА] " + where + " (" + p.getName() + "): " + e, e);
              }

              @EventHandler
              public void onClose(InventoryCloseEvent e) {
                  Session s = sessions.get(e.getPlayer().getUniqueId());
                  if (s != null && s.inv != null && s.inv == e.getInventory()) {
                      returnItems(s);
                      cleanup(s);
                  }
              }

              @EventHandler
              public void onQuit(PlayerQuitEvent e) {
                  UUID id = e.getPlayer().getUniqueId();
                  Session s = sessions.get(id);
                  if (s != null) {
                      returnItems(s);
                      sessions.remove(id);
                  }
                  forms.remove(id);
                  snapshots.remove(id);
              }

              // ------------------------------------------------------------------ клики

              @EventHandler(priority = EventPriority.HIGHEST)
              public void onTransaction(InventoryTransactionEvent e) {
                  Player p = e.getTransaction().getSource();
                  Session s = sessions.get(p.getUniqueId());
                  if (s == null || s.inv == null) {
                      return;
                  }
                  boolean ours = false;
                  boolean bad = false;
                  int ctrl = -1;
                  for (InventoryAction a : e.getTransaction().getActions()) {
                      if (a instanceof SlotChangeAction) {
                          SlotChangeAction sa = (SlotChangeAction) a;
                          if (sa.getInventory() == s.inv) {
                              ours = true;
                              int slot = sa.getSlot();
                              if (slot >= ITEM_SLOTS) {
                                  if (ctrl < 0) {
                                      ctrl = slot;
                                  }
                              } else {
                                  Item t = sa.getTargetItem();
                                  if (t != null && !t.isNull() && match(t) == null) {
                                      bad = true;
                                  }
                              }
                          }
                      }
                  }
                  if (!ours) {
                      return;
                  }
                  if (ctrl >= 0 || bad || !s.open) {
                      e.setCancelled(true);
                      if (bad && ctrl < 0) {
                          p.sendMessage("§cСкупщик это не покупает (или книга с несколькими зачарованиями). Смотри «Посмотреть цены на продажу».");
                      }
                      if (ctrl >= 0) {
                          final int c = ctrl;
                          later(1, () -> {
                              handleClick(s, c);
                              resync(s);
                          });
                      } else {
                          later(1, () -> resync(s));
                      }
                      return;
                  }
                  // предметы кладут/забирают в верхних рядах - обновляем итог
                  later(2, () -> refresh(s));
              }

              private void resync(Session s) {
                  try {
                      if (sessions.get(s.player.getUniqueId()) == s && s.inv != null && s.player.isOnline()) {
                          s.inv.sendContents(s.player);
                          s.player.getInventory().sendContents(s.player);
                      }
                  } catch (Exception ignored) {
                      // не критично
                  }
              }

              private void refresh(Session s) {
                  try {
                      if (sessions.get(s.player.getUniqueId()) == s && s.inv != null && s.open) {
                          renderControls(s);
                      }
                  } catch (Exception ex) {
                      err(s.player, "обновление итога", ex);
                  }
              }

              private void handleClick(Session s, int slot) {
                  if (sessions.get(s.player.getUniqueId()) != s || !s.open) {
                      return;
                  }
                  long t = now();
                  if (t - s.last < 300) {
                      return;
                  }
                  s.last = t;
                  final Player p = s.player;
                  try {
                      if (slot == S_SELL) {
                          doSell(s);
                      } else if (slot == S_CANCEL) {
                          closeChest(s);
                          later(6, () -> showMainForm(p));
                      }
                  } catch (Exception ex) {
                      err(p, "клик в сундуке", ex);
                      p.sendMessage("§cОшибка скупщика. Сообщи администратору.");
                  }
              }

              // ------------------------------------------------------------------ продажа

              private Plan plan(Session s) {
                  Plan pl = new Plan();
                  long cap = Math.min(limitLeft(), roomOf(s.player));
                  double acc = 0;
                  for (int i = 0; i < ITEM_SLOTS; i++) {
                      Item it = s.inv.getItem(i);
                      if (it == null || it.isNull()) {
                          continue;
                      }
                      Entry e = match(it);
                      if (e == null) {
                          continue;
                      }
                      Double base = s.snap.price.get(e.key);
                      double u = (base == null ? e.price : base) * lvlFactor(e, it) * durFactor(it);
                      int c = it.getCount();
                      if (u <= 0 || c <= 0) {
                          continue;
                      }
                      int n = c;
                      if (Math.floor(acc + u * c + 1e-9) > cap) {
                          n = (int) Math.floor((cap + 1 - 1e-6 - acc) / u);
                          n = Math.max(0, Math.min(c, n));
                      }
                      if (n < c) {
                          pl.capped = true;
                      }
                      if (n <= 0) {
                          continue;
                      }
                      acc += u * n;
                      pl.sell[i] = n;
                      pl.units += n;
                      pl.byEntry.merge(e, n, Integer::sum);
                  }
                  pl.total = Math.min((long) Math.floor(acc + 1e-9), cap);
                  return pl;
              }

              private long roomOf(Player p) {
                  try {
                      long r = eco.room(key(p));
                      return r < 0 ? Long.MAX_VALUE : r;
                  } catch (Exception e) {
                      return Long.MAX_VALUE;
                  }
              }

              private void renderControls(Session s) {
                  Plan pl = plan(s);
                  Item filler = ui(mk("stained_glass_pane:15", "iron_bars"), 1, "§r ");
                  for (int i = ITEM_SLOTS; i < 27; i++) {
                      s.inv.setItem(i, filler);
                  }
                  List<String> info = new ArrayList<>();
                  info.add("§7К получению: §a" + fmtL(pl.total) + " монет");
                  info.add("§7Предметов: §f" + fmtL(pl.units));
                  info.add("§7Лимит скупщика на сегодня: §f" + fmtL(limitLeft()));
                  info.add("§7До сброса: §f" + fmtDur(untilReset()));
                  if (pl.capped) {
                      info.add("§cЧасть предметов не влезет в лимит и вернётся тебе");
                  }
                  s.inv.setItem(S_INFO, ui(mk("paper", "paper"), 1, "§eИтог продажи", info.toArray(new String[0])));
                  s.inv.setItem(S_SELL, ui(mk("emerald", "gold_ingot"), 1, "§a§lПродать",
                          "§7Получишь: §a" + fmtL(pl.total) + " монет", "§7Нажми, чтобы продать"));
                  s.inv.setItem(S_CANCEL, ui(mk("barrier", "arrow"), 1, "§cОтмена", "§7Вернуть предметы и выйти"));
              }

              private void doSell(Session s) {
                  final Player p = s.player;
                  Plan pl = plan(s);
                  if (pl.total <= 0) {
                      if (limitLeft() <= 0) {
                          p.sendMessage("§cДневной лимит скупщика исчерпан. Сброс через " + fmtDur(untilReset()) + " (23:59 МСК).");
                      } else if (pl.units == 0 && !pl.capped) {
                          p.sendMessage("§cПоложи в сундук предметы, которые покупает скупщик.");
                      } else {
                          p.sendMessage("§cЗа эти предметы скупщик ничего не заплатит.");
                      }
                      return;
                  }
                  String r;
                  try {
                      r = eco.deposit(key(p), pl.total, "buyer sell x" + pl.units);
                  } catch (Exception ex) {
                      err(p, "зачисление монет", ex);
                      p.sendMessage("§cОшибка зачисления монет. Ничего не продано.");
                      return;
                  }
                  if (!"OK".equals(r)) {
                      p.sendMessage("§cОшибка зачисления: " + r + ". Ничего не продано.");
                      return;
                  }
                  long t = now();
                  for (Map.Entry<Entry, Integer> en : pl.byEntry.entrySet()) {
                      Stock st = stock(en.getKey(), t);
                      st.s += en.getValue();
                  }
                  checkPeriod();
                  spent += pl.total;
                  PStat ps = stats.computeIfAbsent(key(p), k -> new PStat());
                  ps.nick = p.getName();
                  ps.coins += pl.total;
                  ps.items += pl.units;
                  for (int i = 0; i < ITEM_SLOTS; i++) {
                      if (pl.sell[i] <= 0) {
                          continue;
                      }
                      Item it = s.inv.getItem(i);
                      if (it == null || it.isNull()) {
                          continue;
                      }
                      if (pl.sell[i] >= it.getCount()) {
                          s.inv.clear(i);
                      } else {
                          Item c = it.clone();
                          c.setCount(it.getCount() - pl.sell[i]);
                          s.inv.setItem(i, c);
                      }
                  }
                  snapshots.remove(p.getUniqueId());
                  save();
                  p.sendMessage("§aПродано: " + fmtL(pl.units) + " шт. Получено: " + fmtL(pl.total) + " монет.");
                  if (pl.capped) {
                      p.sendMessage("§eЧасть предметов не продана: дневной лимит скупщика (или максимум баланса). Остаток вернулся в инвентарь.");
                  }
                  closeChest(s);
                  later(8, () -> showMainForm(p));
              }

              // ------------------------------------------------------------------ экономика и инвентарь

              private String key(Player p) {
                  return p.getName().trim().toLowerCase(Locale.ROOT).replace(' ', '_');
              }

              private long safeBalance(Player p) {
                  try {
                      return eco.balance(key(p));
                  } catch (Exception e) {
                      return 0;
                  }
              }

              /** Выдать предметы; то, что не влезло, падает под ноги. */
              private void give(Player p, Item ref, int count) {
                  Item it = ref.clone();
                  it.setCount(count);
                  Item[] left = p.getInventory().addItem(it);
                  if (left != null) {
                      for (Item l : left) {
                          if (l != null && !l.isNull()) {
                              p.getLevel().dropItem(p, l);
                          }
                      }
                  }
              }

              private static Item ui(Item base, int count, String name, String... lore) {
                  Item r = base.clone();
                  r.setCount(Math.max(1, count));
                  r.setCustomName(name);
                  if (lore != null && lore.length > 0) {
                      r.setLore(lore);
                  }
                  return r;
              }

              /** Предмет-кнопка по имени; если имя не распознано - запасной, а в крайнем случае бумага. */
              private static Item mk(String id, String fallback) {
                  Item it = safeItem(id);
                  if (it == null) {
                      it = safeItem(fallback);
                  }
                  if (it == null) {
                      it = Item.get(Item.PAPER);
                  }
                  return it;
              }

              private static Item safeItem(String id) {
                  try {
                      Item it = Item.fromString(id);
                      return it == null || it.getId() == 0 ? null : it;
                  } catch (Exception e) {
                      return null;
                  }
              }
          }
          EOF

      - name: Build with Maven
        run: mvn -B -ntp package

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: Buyer-plugin
          path: target/Buyer-*.jar
          if-no-files-found: error
